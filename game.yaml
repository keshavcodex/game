apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-engine
  template:
    metadata:
      labels:
        app: game-engine
    spec:
      containers:
        - name: game-engine
          image: keshavcodex/game-engine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: game-engine
spec:
  selector:
    app: game-engine
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-ui
  template:
    metadata:
      labels:
        app: game-ui
    spec:
      containers:
        - name: game-ui
          image: keshavcodex/game-ui
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: game-ui
spec:
  selector:
    app: game-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
