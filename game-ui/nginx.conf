server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Strip the /backend prefix and proxy requests to the internal Kubernetes Service.
    # For example, /backend/random is forwarded as http://game-engine:8080/random.
    location /backend/ {
        proxy_pass http://game-engine:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host game-engine;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
